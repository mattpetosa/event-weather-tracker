# Example reverse proxy. Add TLS (certbot --nginx, or your own certificate)
# before putting it on the internet. The app trusts X-Forwarded-For only when
# EWT_TRUST_PROXY=1, and then reads the last address in it, the one nginx adds.
server {
    listen 80;
    server_name weather.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
