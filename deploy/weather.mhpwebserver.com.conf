# deploy/weather.mhpwebserver.com.conf  →  /etc/nginx/sites-available/
# Static site; the only dynamic piece is data/latest.json written hourly by
# the weather-collect systemd timer. No backend, no port.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weather.mhpwebserver.com;

    ssl_certificate     /etc/letsencrypt/live/mhpwebserver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhpwebserver.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/robots-noindex.conf;

    root /home/matt/weather-redbank/www;
    index index.html;

    # Only the current snapshot is public; the history directory stays private.
    location = /data/latest.json {
        include /etc/nginx/snippets/noindex.conf;
        alias /home/matt/weather-redbank/data/latest.json;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
    }
    location /data/ { return 404; }

    location / {
        include /etc/nginx/snippets/noindex.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }
}
